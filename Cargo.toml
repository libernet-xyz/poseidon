[package]
name = "starkom-poseidon"
version = "5.1.4"
description = "Starkom's implementation of the Poseidon algebraic hash."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/poseidon.git"
readme = "README.md"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
primitive-types = "0.14.0"
sha3 = { version = "0.12.0", optional = true }
starkom-bluesky = { version = "4.0.1", optional = true }
starkom-ff = "5.0.2"
starkom-goldilocks = { version = "4.0.0", optional = true }
starkom-koalabear = { version = "2.0.0", optional = true }
starkom-schraderbrau = { version = "2.0.0", optional = true }

[features]
default = []
bls12_381 = []
bluesky = ["starkom-bluesky"]
cipher = ["sha3"]
goldilocks = ["starkom-goldilocks"]
koalabear = ["starkom-koalabear"]
schraderbrau = ["starkom-schraderbrau"]
