[package]
name = "starkom-poseidon"
version = "3.1.1"
description = "Starkom's implementation of the Poseidon algebraic hash."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/poseidon.git"
readme = "README.md"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
primitive-types = "0.14.0"
sha3 = { version = "0.12.0", optional = true }
starkom-bluesky = { version = "3.2.0", optional = true }
starkom-ff = "2.3.0"

[features]
default = ["bluesky"]
bls12_381 = []
bluesky = ["starkom-bluesky"]
cipher = ["sha3"]
